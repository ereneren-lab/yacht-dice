    /* TOKENS:START */
/**
 * public/tokens.css — 딱세판만(구 주사위 골목) 공용 디자인 토큰 (Phase 1 · A-now)
 *
 * 명세: outputs/production/2026-08-11_dice-alley_design-tokens-spec.md
 *
 * ⚠️ 이 파일은 신규 파일이며, 아직 어떤 HTML도 이 파일을 참조하지 않는다(안전).
 *    실제 배선(각 게임 HTML에서 이 파일을 불러오고, 자체 :root를 지우는 작업)은
 *    Orchestrator가 npm run build / npm run check:drift / npm run audit:tokens 와
 *    함께 별도로 진행한다. 이 파일 자체는 어떤 기존 페이지의 렌더링도 바꾸지 않는다.
 *
 * 설계 원칙 — "토큰 이름은 한 번만 세우고, 값은 테마/시즌으로 바꾼다."
 *    지금(A)은 에스프레소 골드 톤으로 채운다. 나중에 B(설화 야시장) 세계관이 붙을 때도
 *    아래 토큰 '이름'은 하나도 안 바뀐다 — 이 파일의 HEX 값만 교체되거나,
 *    data-theme에 새 값이 추가된다. 근거와 로드맵 표는 명세서 8절 참고.
 *
 * 구성
 *   1. 서피스 · 텍스트 (앱 크롬 공통 — 13게임 전부 상속, 게임판만 예외)
 *   2. 강조 · 상태 (브랜드골드 / 코인 / 경고 / 성공 / 위험 / accent 예약)
 *   3. 레거시 별칭 — 기존 파일들이 쓰던 이름(--brass, --gold, --accent 등)을
 *      당분간 병행 지원해, 파일이 이 시트를 불러오기 시작해도 즉시 깨지지 않게 한다.
 *      (개별 파일이 새 이름으로 완전히 이관되면 그 파일의 :root에서 옛 이름 참조를
 *       걷어내고, 이 별칭 블록에 대한 의존을 줄여나간다.)
 *
 * 이 파일에 없는 것 (의도적)
 *   --felt / --felt2 / --chip / --board / --boardline : 게임판 표면 전용 예외 토큰.
 *     "앱 크롬은 하나, 테이블만 게임의 개성"(전략 문서 3-8) 원칙에 따라 게임별 파일에
 *     남겨둔다. 공용 파일에 넣지 않는다.
 *   --you / --opp / --die / --die2 / --pip / --team0 / --team1 : 게임 컴포넌트 전용
 *     토큰. 이번 Phase 1(브랜드 강조색 재배정)의 대상이 아니다.
 */

:root {
  /* 폰트 — 기존 스택 그대로, 새로 추가 없음 */
  --font: "Pretendard", "Space Grotesk", -apple-system, system-ui, "Segoe UI", "Apple SD Gothic Neo", sans-serif;

  /* ── 1. 서피스 · 텍스트 (에스프레소 = 기본) ───────────────────────── */
  --bg: #15110d;
  --bg2: #1d1711;
  --panel: #26201a;
  --panel2: #2f2820;
  --line: rgba(255, 255, 255, .09);
  --ink: #f3ece0;
  --muted: #a89a86;

  /* ── 2. 강조 · 상태 (에스프레소) ──────────────────────────────────── */
  /* 브랜드 골드 — 로고 · 워드마크 · 1차 CTA 전용. 그 외 어디에도 쓰지 않는다. */
  --brand-gold: #e0a23c;
  --brand-gold-d: #b07d24;
  --brand-gold-ink: #15110d; /* 골드 배경 위 텍스트색. 기존 다크 테마에 미정의였던 값을 명시(스펙 4-4) */

  /* 코인 — 재화(코인/칩) 숫자 · 레벨/보상 진행바 전용. 브랜드 골드와 육안으로 구분됨 */
  --coin: #f0c65a;
  --coin-d: #c98f1f;

  /* 경고 — 성공도 위험도 아닌 '주의' 상태. 코드에 전례 없는 완전 신규 토큰 */
  --warn: #e0812f;

  /* 성공 / 위험 — 기존값 유지 (보드군·카드군에서 이미 동일값으로 쓰이고 있었음) */
  --win: #7bd88f;
  --danger: #e8696b;

  /* B(설화 야시장) 세계관을 위한 예약 자리.
     A-now에서는 독립된 값이 없다 — 브랜드 골드에 별칭으로만 존재해 "이름은 있지만
     지금은 시각적으로 아무 일도 안 한다"를 보장한다. B 착수 시 이 한 줄만 옥색 계열
     HEX로 바꾸면 된다(스펙 8절 로드맵 표). */
  --accent: var(--brand-gold);
}

/* ── 흑임자 (다크 알트) ──────────────────────────────────────────────
   ⚠️ 브랜드 강조색이 테마마다 '다른 색상'일 수 있다는 기존 전례(라벤더)를
      의도적 규칙으로 승격한 것 — 에스프레소=따뜻한 골드, 흑임자=차가운 라벤더. */
html[data-theme="sesame"] {
  --bg: #121212;
  --bg2: #181818;
  --panel: #1f1f1f;
  --panel2: #2a2a2a;
  --line: rgba(255, 255, 255, .11);
  --ink: #f0ede8;
  --muted: #989088;

  --brand-gold: #c9bcd8;   /* 라벤더 — 기존 --brass 흑임자값 그대로 계승 */
  --brand-gold-d: #9a8ab0;
  --brand-gold-ink: #121212;

  --coin: #e4d9a8;         /* [신규 · 확인필요] 카드군에 흑임자 전례가 없어 신규 제안.
                               라벤더 브랜드골드와 채도로 구분되는 베이지 계열. 대비 실측 전. */
  --coin-d: #c2b78a;       /* [신규 · 확인필요] */

  --warn: #d99a6a;
  --win: #9ad0a8;
  --danger: #e88a8a;

  --accent: var(--brand-gold);
}

/* ── 한지 (라이트) ────────────────────────────────────────────────────
   기존 --brass는 2026-08-05에 라이트 대비 문제(3.40:1 → 4.93:1)로 이미 패치된 값이다.
   같은 원칙(색조는 유지, 명도만 낮춤)을 신규 토큰(--coin, --warn)에도 동일 적용했다. */
html[data-theme="hanji"] {
  --bg: #f2f3f5;
  --bg2: #ffffff;
  --panel: #ffffff;
  --panel2: #eceef1;
  --line: rgba(0, 0, 0, .10);
  --ink: #1c1c1e;
  --muted: #6e6e76;

  --brand-gold: #8f6420;   /* 기존값 그대로 (4.93:1, 코드 주석 기준 실측 완료) */
  --brand-gold-d: #6b4a11;
  --brand-gold-ink: #fff8ec;

  --coin: #8a6210;         /* [실측 완료 2026-08-11] 기존 #a67613은 흰 패널 위 4.02:1(AA 미달)이라
                               세 배경(bg 4.93 · 흰패널 5.48 · panel2 4.71) 모두 AA 통과값으로 조정.
                               ⚠️ 라이트에선 대비 제약상 brand-gold(#8f6420)와 색이 가까워진다 —
                               코인/브랜드 구분은 다크 2테마가 담당하고, 라이트에선 위치·굵기가 담당(스펙 9절). */
  --coin-d: #7d5809;       /* shop.html 기존 실측값 재사용 (6.42:1) */

  --warn: #a85210;         /* [실측 완료 2026-08-11] 기존 #b85c14는 4.13:1(AA 미달) → 4.88/5.41/4.66 통과값 */
  --win: #3a9a4a;
  --danger: #d84535;

  --accent: var(--brand-gold);
}

/* ══════════════════════════════════════════════════════════════════
 * 3. 레거시 별칭 — 임시 다리 (마이그레이션 완료 전까지만 유효)
 *
 * 기존 13개 게임 HTML은 아래 옛 이름으로 브랜드 강조색을 참조한다:
 *   --brass / --brass-d / --brass-ink  (허브 + 보드 5종 + 카드군 7종 + 알까기)
 *   --accent / --accent-ink            (yacht.html만 — 스펙 4-3의 이름 충돌 사례)
 *   --gold                             (카드군 7종 + 알까기 + yacht + shop — 코인 역할의 구(舊)이름)
 *
 * 이 별칭들은 "옛 이름을 새 값에 연결"할 뿐, 새 이름(--brand-gold/--coin)의 정의를
 * 바꾸지 않는다. 각 게임 파일이 이관되면(스펙 7절 체크리스트) 자체 :root에서 옛 이름
 * 선언을 지우고 이 시트를 참조하게 되므로, 이 별칭 블록에 자연히 의존하게 된다 —
 * 최종적으로는 파일 내부의 var(--brass) 등 '참조부' 자체를 var(--brand-gold)로
 * 바꾸는 것이 목표이며, 그때는 이 별칭 블록을 지워도 된다.
 *
 * ⚠️ yacht.html은 --accent를 '브랜드 골드의 별칭'이라는 다른 뜻으로 이미 쓰고 있다.
 *    이 시트의 --accent(B 예약 자리)와 이름이 겹친다 — yacht.html이 이 시트를 참조하기
 *    전에 반드시 자체 --accent/--accent-ink 참조를 --brand-gold/--brand-gold-ink로
 *    개명할 것(스펙 6-4, 7-2). 개명 전에는 yacht.html에 이 시트를 연결하지 말 것.
 * ══════════════════════════════════════════════════════════════════ */
:root {
  --brass: var(--brand-gold);
  --brass-d: var(--brand-gold-d);
  --brass-ink: var(--brand-gold-ink);
  --gold: var(--coin);
}
html[data-theme="sesame"] {
  --brass: var(--brand-gold);
  --brass-d: var(--brand-gold-d);
  --brass-ink: var(--brand-gold-ink);
  --gold: var(--coin);
}
html[data-theme="hanji"] {
  --brass: var(--brand-gold);
  --brass-d: var(--brand-gold-d);
  --brass-ink: var(--brand-gold-ink);
  --gold: var(--coin);
}

/* ══════════════════════════════════════════════════════════════════
 * 4. 달빛 야시장 (yasi) — B(리브랜딩) 세계관을 '테마'로 얹은 것 (2026-08-11)
 *
 * 절충 방향의 실현: 토큰 '이름'은 그대로, '값'만 인디고 밤하늘 + 등불 주황 +
 * 옥색 + 진홍으로 교체한다. 사용자가 테마 칩에서 골라 켜고 끌 수 있어 리스크 0.
 * 전 게임(주입된 파일)에 자동 적용된다 — 토큰 단일소스의 payoff.
 * 대비 실측(2026-08-11): 전 강조색 AA 통과(진홍 #e85d72 bg 5.55·panel 4.54).
 * ══════════════════════════════════════════════════════════════════ */
html[data-theme="yasi"] {
  --bg: #0d1220;          /* 밤하늘 인디고 */
  --bg2: #131b2e;
  --panel: #1b2440;
  --panel2: #26315a;
  --line: rgba(180, 195, 235, .14);
  --ink: #f5eddc;         /* 등불빛 도는 미색 */
  --muted: #97a0c0;

  --brand-gold: #ffb454;  /* 등불 주황 — 로고·CTA */
  --brand-gold-d: #e0912f;
  --brand-gold-ink: #241606;

  --coin: #f4c94b;        /* 금박/복주머니 금 */
  --coin-d: #cc9e2e;

  --warn: #ef9a3c;
  --win: #37b98c;         /* 옥색 — 성공(accent와 통합) */
  --danger: #e85d72;      /* 복주머니 진홍(대비 보정) */
  --accent: #37b98c;      /* 옥색 — B에서 처음 독립값을 가짐(A에선 브랜드골드 별칭) */

  /* 게임판 펠트 — 야시장에선 옥색 도박판으로. 이 테마에서만 게임 로컬 --felt를 덮는다
     (html[data-theme]가 게임 :root보다 특이도 높음). 카드·카지노 게임에 일괄 적용. */
  --felt: #124a42;
  --felt2: #0d332e;

  /* 레거시 별칭 — 이관 안 된 사용처(var(--brass)/var(--gold)) 무중단 */
  --brass: var(--brand-gold);
  --brass-d: var(--brand-gold-d);
  --brass-ink: var(--brand-gold-ink);
  --gold: var(--coin);
}
/* TOKENS:END */
  :root{
  }
  html[data-theme="sesame"]{ }
  html[data-theme="hanji"]{ }
  html,body{height:100%}
  body{background:
      radial-gradient(1200px 700px at 50% -10%, #2a2017 0%, transparent 60%),
      radial-gradient(900px 600px at 90% 110%, #221a2e 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--font); min-height:100%;
    display:flex; flex-direction:column; align-items:center; -webkit-tap-highlight-color:transparent}
  html[data-theme="hanji"] body{ background:linear-gradient(180deg,#f7f8fa,#eef0f3); background-attachment:fixed }
  .wrap{width:100%; max-width:560px; padding:22px 18px 60px; margin:0 auto}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .iconbtn{position:relative;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;
    width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;
    cursor:pointer;text-decoration:none}
  .iconbtn::after{content:'';position:absolute;inset:-4px}
  h1{font-size:20px;font-weight:900;letter-spacing:-.01em;flex:1}
  h1 small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-top:2px}

  .coinbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px;padding:13px 16px;
    border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--bg2));font-weight:800}
  .coinbar .lbl{font-size:12.5px;color:var(--muted)}
  .coinbar b{color:var(--gold);font-size:20px}

  .cat{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;color:var(--muted);margin:22px 2px 11px}
  .cat::after{content:'';flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:1fr;gap:11px}
  .card{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:16px;padding:14px;
    background:linear-gradient(180deg,var(--panel),var(--bg2));transition:border-color .15s,transform .08s}
  .card.have{border-color:color-mix(in srgb,var(--brass) 50%,var(--line))}
  .card .ic{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;
    border-radius:13px;background:var(--panel2);border:1px solid var(--line)}
  .card .mid{flex:1;min-width:0}
  .card .nm{font-size:14.5px;font-weight:800}
  .card .ds{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .card .act{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .price{font-size:13px;font-weight:900;color:var(--gold);white-space:nowrap}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:11px;padding:9px 14px;
    font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn.buy{background:linear-gradient(180deg,var(--brass),var(--brass-d));border-color:transparent;color:#241a08}
  .btn.on{background:color-mix(in srgb,var(--win) 22%,var(--panel2));border-color:color-mix(in srgb,var(--win) 55%,var(--line))}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .note{font-size:12px;color:var(--muted);line-height:1.6;margin:10px 2px 0}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    background:rgba(24,16,8,.95);color:#ffe9b8;border:1.5px solid rgba(196,150,74,.6);border-radius:999px;
    padding:10px 20px;font-size:13.5px;font-weight:800;opacity:0;transition:opacity .18s;pointer-events:none;z-index:99}
  .toast.on{opacity:1}
  .preview{display:flex;gap:6px;margin-top:7px}
  .pdie{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
  @media (max-width:380px){ .card .ds{display:none} }
</style>
</head>

<div class="wrap">

    판에 쓰는 아이템은 팔지 않는다 — <b>아이템전</b>을 켜면 <b>모두에게 같은 개수</b>가 주어진다(돈으로 유리해지지 않게).<br>
    산 물건은 이 브라우저에 저장된다. 기존 테마·아바타는 그대로 무료다.
  </p>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};

  // 테마(허브와 같은 키)
  try{
    var t=localStorage.getItem('alley_theme'); if(t) document.documentElement.dataset.theme=t;
    var dark=localStorage.getItem('alley_theme_dark');
    $('lightBtn').onclick=function(){
      var cur=document.documentElement.dataset.theme;
      var next=(cur==='hanji')?(localStorage.getItem('alley_theme_dark')||'brass'):'hanji';
      document.documentElement.dataset.theme=next;
      try{ localStorage.setItem('alley_theme',next); if(next!=='hanji') localStorage.setItem('alley_theme_dark',next); }catch(e){}
    };
  }catch(e){}

  var toastT=0;
  function toast(m){ var el=$('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove('on')},1500); }

  var GROUPS=[
    {slot:'dice',  title:'🎲 주사위 스킨',  sub:'주사위가 나오는 5게임에 전부 적용'},
    /* 이모지 아바타 팩은 내렸다(2026-08-04) — 허브에 이모지 직접 입력칸이 있어서 팔 수 있는 물건이 아니었다.
       이 자리는 **직접 만든 캐릭터**(public/img 소프트 3D 마스코트)의 스킨/코스튬이 들어올 자리다.
       CATALOG에 slot:'char' 항목이 생기면 이 줄만 살아난다(항목이 없으면 그룹은 자동으로 안 그려진다). */
    {slot:'char',  title:'🐷 캐릭터',      sub:'사면 아바타 목록에 열린다 — 프로필이나 게임에서 고르면 13게임에 따라다닌다'},
    {slot:'pack',  title:'😀 아바타 팩',    sub:'허브 프로필에서 고를 수 있게 된다'},
    {slot:'title', title:'🏮 칭호',         sub:'이름 옆에 붙는다'}
  ];

  function diePreview(it){
    if(!it.vars) return '';
    var h='<div class="preview">';
    for(var i=1;i<=3;i++) h+='<span class="pdie" style="background:linear-gradient(150deg,'+it.vars['--die']+','+it.vars['--die2']+');color:'+it.vars['--pip']+'">'+i+'</span>';
    return h+'</div>';
  }

  function render(){
    var host=$('cats'); host.innerHTML='';
    GROUPS.forEach(function(g){
      var items=SHOP.CATALOG.filter(function(x){return x.slot===g.slot});
      if(!items.length) return;
      var h=document.createElement('div');
      h.className='cat'; h.innerHTML='<span>'+g.title+'</span>';
      host.appendChild(h);
      var grid=document.createElement('div'); grid.className='grid';
      items.forEach(function(it){
        var owned=SHOP.owned(it.id), eq=SHOP.equipped(it.slot)===it.id;
        var c=document.createElement('div'); c.className='card'+(owned?' have':'');
        c.innerHTML='<div class="ic">'+((it.char&&window.CHARS)?CHARS.html(it.char):it.icon)+'</div>'+
          '<div class="mid"><div class="nm">'+it.name+'</div><div class="ds">'+it.desc+'</div>'+diePreview(it)+'</div>'+
          '<div class="act">'+(owned?'':'<span class="price">🪙 '+it.price.toLocaleString()+'</span>')+
          '<button class="btn '+(owned?(eq?'on':''):'buy')+'" data-id="'+it.id+'" data-act="'+(owned?((it.slot==='pack'||it.slot==='char')?'has':'equip'):'buy')+'">'+
          (owned?((it.slot==='pack'||it.slot==='char')?'보유 중':(eq?'장착 중':'장착')):'구매')+'</button></div>';
        grid.appendChild(c);
      });
      host.appendChild(grid);
      var s=document.createElement('p'); s.className='note'; s.style.margin='7px 2px 0'; s.textContent=g.sub;
      host.appendChild(s);
    });

    // 프리미엄(실제 결제 영역 — 코인으로 팔지 않는다)
    var ph=document.createElement('div'); ph.className='cat'; ph.innerHTML='<span>🚫 광고 제거</span>'; host.appendChild(ph);
    var pg=document.createElement('div'); pg.className='grid';
    var isP=false; try{ isP=!!(window.MZ&&MZ.isPremium()); }catch(e){}
    pg.innerHTML='<div class="card'+(isP?' have':'')+'"><div class="ic">✨</div>'+
      '<div class="mid"><div class="nm">프리미엄</div><div class="ds">'+(isP?'적용 중 — 광고가 나오지 않는다':'광고를 완전히 끈다. 코인이 아니라 실제 결제다.')+'</div></div>'+
      '<div class="act"><button class="btn" id="premBtn"'+(isP?' disabled':'')+'>'+(isP?'보유 중':'준비 중')+'</button></div></div>';
    host.appendChild(pg);
    var pn=document.createElement('p'); pn.className='note'; pn.style.margin='7px 2px 0';
    pn.textContent='지금은 광고 자체를 꺼둔 상태라 살 필요가 없다. 결제 연결 후 열린다.';
    host.appendChild(pn);
  }

  document.addEventListener('click', function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var id=b.dataset.id, act=b.dataset.act;
    if(act==='buy'){
      var r=SHOP.buy(id);
      if(!r.ok){ toast('❌ '+r.why); return; }
      toast('🎉 '+r.item.name+' 구매!');
    } else if(act==='equip'){
      SHOP.equip(id);
      var it=SHOP.item(id);
      toast(SHOP.equipped(it.slot)===id ? '✅ '+it.name+' 장착' : '해제했어');
    } else { toast('아바타는 허브 프로필에서 고르면 돼'); }
    render();
  });

  render();
})();
</script>
</body>
</html>
